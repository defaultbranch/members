name: maven-verify

env:
  JAVA_VERSION: 25

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  maven-verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Temurin JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven Verify
        run: mvn --errors --update-snapshots --batch-mode verify
